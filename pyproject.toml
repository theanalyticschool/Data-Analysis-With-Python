[project]
name = "data-analysis-with-python"
version = "0.1.0"
description = "A hands-on Python data analysis project covering data cleaning, transformation, exploratory data analysis, and visualization workflows."
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyodbc>=5.3.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pandas-stubs>=3.0.3.260530",
]
